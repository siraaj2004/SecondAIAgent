services:
  - type: web
    name: second-ai-agent
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/server.py"
    healthCheckPath: /health
    envVars:
      - key: APP_API_KEY
        sync: false
      - key: DB_PATH
        value: data/workflow.db
